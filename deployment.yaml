apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ts-api
  template:
    metadata:
      labels:
        app: ts-api
    spec:
      containers:
      - name: ts-api
        image: ts-api:v1
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: ts-api-service
spec:
  type: NodePort
  selector:
    app: ts-api
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
