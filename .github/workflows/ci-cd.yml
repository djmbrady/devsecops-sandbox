name: CI/CD & Security Scan Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Compile TypeScript
        run: |
          npm ci
          npx tsc

      - name: Build Docker Image
        run: docker build -t ts-api:${{ github.sha }} .

      # Optional: keep your raw Trivy check, pinned to a post-incident release with the v prefix
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ts-api:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # Checkout the separate CVE Identification Agent repository into ./agent-repo
      - name: Checkout CVE Identification Agent
        uses: actions/checkout@v4
        with:
          repository: djmbrady/cve-identification-agent
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: agent-repo

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: agent-repo/requirements.txt

      - name: Install Agent Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent-repo/requirements.txt

      - name: Run Docker Image Identification Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IMAGE_TAG: ts-api:${{ github.sha }}
        run: python agent-repo/docker_image_identifier.py
